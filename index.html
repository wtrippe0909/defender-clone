<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Defender Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="stage">
      <canvas id="screen" width="640" height="480" aria-label="Defender game screen"></canvas>
    </main>

    <div id="touch" aria-hidden="true">
      <div class="pad dpad">
        <button data-action="up" style="grid-area: up">&#9650;</button>
        <button data-action="left" style="grid-area: left">&#9664;</button>
        <button data-action="right" style="grid-area: right">&#9654;</button>
        <button data-action="down" style="grid-area: down">&#9660;</button>
      </div>
      <div class="pad actions">
        <button data-action="hyper">HYP</button>
        <button data-action="bomb">BOMB</button>
        <button data-action="fire" class="fire">FIRE</button>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
